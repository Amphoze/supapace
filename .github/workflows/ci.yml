# Continuous integration. Actions are pinned by major tag, not by commit.
#
#   public      the content gate over the tree and over the pushed or proposed commits
#   unit        gofmt, go vet (also with the reach tag), go test -race
#   reach       the end-to-end suite in the test node container, as `make reach` locally,
#               with the object-store stand-in beside the node; the object-store
#               client's tests against the stand-in image
#   reach-host  the suite on the runner VM itself, installed by scripts/install-node.sh
#               (no stand-in)
#   dash        the dashboard: the Studio image (cached), the browser harness's own
#               tests in a bare node, then the suite on a node with a studio domain,
#               for a studio domain off the public suffix list and one on it
#
# Pull requests from forks get no secrets: the public job then runs the gate's built-in
# rules with a stand-in deny-list and says so.
name: ci

# Pushes to master and tags, and pull requests: a branch with a pull request runs once.
# There is no workflow-wide concurrency group: a pending push run is never cancelled before
# its commits are range-checked; only the long node jobs share a group per ref.
on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"

jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # The deny-list is written to a file outside the workspace and never printed.
      # Without the secret, the stand-in pattern [^\x00-\x{10FFFF}] is a character
      # class that excludes every character: it compiles and matches no line, so the
      # gate runs with its built-in rules only.
      - name: Deny-list
        env:
          DENYLIST: ${{ secrets.SUPAPACE_DENYLIST }}
        run: |
          umask 077
          f="$RUNNER_TEMP/denylist"
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" >"$f"
          else
            printf '%s\n' '[^\x00-\x{10FFFF}]' >"$f"
            echo "::notice title=content gate::the operator's deny-list is not available to this run; only the built-in rules were applied"
          fi
          echo "SUPAPACE_DENYLIST=$f" >>"$GITHUB_ENV"
      - name: Gate over the tree
        run: scripts/check-public.sh --tree
      - name: Gate over the commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case $EVENT in
          pull_request) range="$BASE..$HEAD" ;;
          push)
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"
            else range=$GITHUB_SHA; fi ;; # new branch, tag or force push: the whole history
          *) range=$GITHUB_SHA ;;
          esac
          scripts/check-public.sh --range "$range"
          # A tag push: the tag object too (tagger, time zone, message).
          # The checkout leaves the tag pointing at its commit: fetch the tag object itself.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            scripts/check-public.sh --tag "refs/tags/$GITHUB_REF_NAME"
          fi
      - name: Gate tests
        run: scripts/test-check-public.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { printf 'not gofmt-formatted:\n%s\n' "$out"; exit 1; }
      - run: go vet ./...
      - run: go vet -tags reach ./...
      - run: go vet -tags 'reach dash' ./...
      - run: go vet -tags browser ./...
      # The Docker tests skip when their pinned image is absent: pull both so they run.
      - name: Pinned images
        run: |
          for k in control_plane postgres; do
            ref=$(sed -n "s/^ *\"$k\": *{\"tag\": *\"\([^\":]*\)[^\"]*\", *\"digest\": *\"\([^\"]*\)\".*/\1@\2/p" internal/nodecfg/images.lock)
            docker pull -q "$ref"
          done
      # Tests that need Docker start throw-away containers labelled supapace.test=1. The
      # skipped tests are listed (root-only tests skip here), so a new skip is visible.
      - name: go test -race
        run: |
          s=0
          go test -race -timeout 30m -v ./... >"$RUNNER_TEMP/test.log" 2>&1 || s=$?
          grep -E -- '^(--- FAIL|FAIL|ok)' "$RUNNER_TEMP/test.log" || true
          grep -E -- '--- SKIP' "$RUNNER_TEMP/test.log" || true
          echo "::notice title=skipped tests::$(grep -c -- '--- SKIP' "$RUNNER_TEMP/test.log") skipped"
          # On failure: each complete race report, each panic or fatal error, and the
          # last 400 lines of each failing test's own output (subtests included); when
          # there is none of these, the log's tail. Reports and panics are cut at 400.
          [ "$s" = 0 ] || {
            awk -v max=400 '
              /^WARNING: DATA RACE$/ { r = 1; n = 0 }
              r { if (++n <= max) print; if (n > 1 && /^==================$/) r = 0; f = 1; next }
              /^(panic|fatal error): / { p = 1; n = 0 }
              p { if (++n <= max) print; if (/^FAIL\t/) p = 0; f = 1; next }
              /^=== (RUN|PAUSE|CONT|NAME) / { t = $3 }
              /^ *--- (PASS|SKIP|FAIL): / {
                lo = c[$3] > max ? c[$3] - max : 0
                if ($2 == "FAIL:") {
                  if (lo) print "[" lo " earlier lines]"
                  for (i = lo + 1; i <= c[$3]; i++) print b[$3, i % max]
                  print; f = 1
                }
                for (i = lo + 1; i <= c[$3]; i++) delete b[$3, i % max]
                delete c[$3]; next
              }
              { b[t, ++c[t] % max] = $0 }
              END { exit !f }' "$RUNNER_TEMP/test.log" || tail -n 100 "$RUNNER_TEMP/test.log"
            exit "$s"
          }

  # The node is a privileged Docker-in-Docker container with a loop-mounted XFS file
  # system (user and project quota) and nftables inside its own network namespace.
  # From the runner it needs: Docker with --privileged and cgroup v2 (--cgroupns
  # private), free loop devices, and the kernel modules the node's mount and nft
  # load on demand (xfs, nf_tables, bridge connection tracking).
  reach:
    needs: [public, unit]
    runs-on: ubuntu-24.04
    concurrency:
      group: reach-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Runner facts
        run: |
          uname -r
          docker version --format 'docker {{.Server.Version}}'
          docker info -f 'store {{.Driver}} {{json .DriverStatus}}'
          stat -fc 'cgroup %T' /sys/fs/cgroup
          sudo losetup -f
          grep -qw xfs /proc/filesystems || sudo modprobe xfs
          grep -w xfs /proc/filesystems
          # ct state in the bridge table needs bridge connection tracking.
          sudo modprobe nf_conntrack_bridge && echo "nf_conntrack_bridge: available"
      # Archives by digest need the containerd image store (scripts/cache-images.sh).
      - name: Containerd image store
        run: |
          f=/etc/docker/daemon.json
          sudo test -s "$f" || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '.features["containerd-snapshotter"] = true' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker info -f '{{.Driver}} {{.DriverStatus}}'
      # Upstream images by digest (images.lock); make images skips archives already cached.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supapace/images
          key: images-${{ runner.arch }}-${{ hashFiles('internal/nodecfg/images.lock') }}
      - run: make images
      # The stand-in image is pulled by make images; these tests start their own container.
      - run: make standin-test
      - run: make node-up
      - name: make reach
        run: |
          set -o pipefail
          make reach 2>&1 | tee "$RUNNER_TEMP/reach.log"
      - name: Skipped suite tests
        if: always()
        run: echo "::notice title=skipped suite tests (reach)::$(grep -c -- '--- SKIP' "$RUNNER_TEMP/reach.log" 2>/dev/null) skipped"
      - name: Node logs
        if: failure()
        run: |
          docker logs --tail 50 sp-node || true
          docker exec sp-node tail -n 200 /var/log/supapaced.log || true
      - name: Node down
        if: always()
        run: make node-down

  # The same suite on the runner VM, installed as a real node (systemd, the host's
  # Docker and nftables), with the host-only tests.
  reach-host:
    needs: [public, unit]
    runs-on: ubuntu-24.04
    concurrency:
      group: reach-host-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Pulls every pinned image into the runner's Docker (it is the node's) and builds the
      # gateway and worker images; no archives, no stand-in.
      - run: make images PULL_ONLY=1 IMAGE_CACHE="$RUNNER_TEMP/images"
      - name: Prepare the host
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nftables xfsprogs
          # init writes daemon.json itself and refuses one holding other keys.
          sudo rm -f /etc/docker/daemon.json
          # TestHost_FirewallRestartReloadsRules restarts the distribution's firewall.
          sudo systemctl enable --now nftables.service
          sudo truncate -s 8G /var/lib/supapace-projects.img
          sudo mkfs.xfs -q /var/lib/supapace-projects.img
          sudo mkdir -p /var/lib/supapace/projects
          sudo mount -o loop,usrquota,prjquota /var/lib/supapace-projects.img /var/lib/supapace/projects
          # The repository filesystem; install-node.sh refuses to install without it.
          sudo truncate -s 8G /var/lib/supapace-repo.img
          sudo mkfs.xfs -q /var/lib/supapace-repo.img
          sudo mkdir -p /var/lib/supapace/repo
          sudo mount -o loop,usrquota,nosuid,nodev,noexec /var/lib/supapace-repo.img /var/lib/supapace/repo
          # The host tests restart Docker several times within a minute; without this the
          # unit's start rate limit refuses the last of them.
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Unit]\nStartLimitIntervalSec=0\n' | sudo tee /etc/systemd/system/docker.service.d/90-ci-no-start-limit.conf >/dev/null
          sudo systemctl daemon-reload
      # The key escrow goes to a file the runner user writes, not to the job log.
      - name: Install the node
        run: |
          # shellcheck disable=SC2024
          sudo scripts/install-node.sh --domain sp.test --dev --ack-escrow >"$RUNNER_TEMP/init.out"
          # The daemon serves, then has ensured the gateway.
          for _ in $(seq 120); do
            sudo /usr/local/bin/supapace node check 2>/dev/null | grep -q '"name":"gateway","ok":true' && break
            sleep 1
          done
          sudo /usr/local/bin/supapace node check
      - name: make reach-host
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" make reach-host 2>&1 | tee "$RUNNER_TEMP/reach.log"
      - name: Skipped suite tests
        if: always()
        run: echo "::notice title=skipped suite tests (reach-host)::$(grep -c -- '--- SKIP' "$RUNNER_TEMP/reach.log" 2>/dev/null) skipped"
      - name: Daemon log
        if: failure()
        run: sudo journalctl -u supapaced --no-pager -n 300 || true
      - name: Docker unit state
        if: failure()
        run: |
          sudo systemctl status docker.service --no-pager -l || true
          sudo journalctl -u docker.service --no-pager -n 80 || true

  # A dashboard node: the node of the reach job with a studio domain and 6 GiB, the
  # Studio and wire-proxy archives loaded. Two configurations: a studio domain off
  # the public suffix list, which runs everything, and one on it, which runs only
  # the suite's tests that drive a browser engine, whose names hold "Browser"
  # (TestDash14_SignIn_Browser, TestDash15_CrossSite_Browser): the step fails when
  # a dashboard test file exists and no test matches. Until the
  # suite has a dashboard test file (test/reach/dash_*_test.go) the first runs
  # make reach on the dashboard node instead of make reach-dash, and the second
  # stops after its checkout.
  dash:
    needs: [public, unit]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: unlisted
            domain: studio.test
          - config: listed
            domain: dyndns.org
    concurrency:
      group: dash-${{ matrix.config }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 150
    env:
      CONFIG: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: What this configuration runs
        run: |
          set -- test/reach/dash_*_test.go
          if [ -e "$1" ]; then echo "DASH_TESTS=1" >>"$GITHUB_ENV"
          elif [ "$CONFIG" = listed ]; then echo "::notice title=dash (listed)::no dashboard test file yet: nothing to run"; fi
      - uses: actions/setup-go@v5
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        with:
          go-version: ${{ env.GO_VERSION }}
      # A node's ruleset may use nft_connlimit. The product never loads a kernel
      # module: the host does, so the runner loads it before a node starts.
      - name: Kernel modules
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        run: |
          sudo modprobe nft_connlimit
          grep -qw xfs /proc/filesystems || sudo modprobe xfs
          sudo modprobe nf_conntrack_bridge
      - name: Containerd image store
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        run: |
          f=/etc/docker/daemon.json
          sudo test -s "$f" || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '.features["containerd-snapshotter"] = true' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
      # The reach job's image cache, restored only: this job's archives stay out of it.
      - uses: actions/cache/restore@v4
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        with:
          path: ~/.cache/supapace/images
          key: images-${{ runner.arch }}-${{ hashFiles('internal/nodecfg/images.lock') }}
      # The Studio archive and build record, keyed on everything the build reads from
      # the tree. A miss builds it: a cold build of 15 to 25 minutes.
      - id: studio
        uses: actions/cache@v4
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        with:
          path: |
            ~/.cache/supapace/images/dash/supapace-studio.tar
            ~/.cache/supapace/images/dash/supapace-studio.build-record.json
          key: studio-${{ runner.arch }}-${{ hashFiles('studio/**', 'internal/dashcfg/**', 'internal/dashtok/testdata/**', 'cmd/sp-dashstub/limits.go', 'cmd/sp-dashstub/main.go', 'internal/nodecfg/**', 'go.mod', 'go.sum') }}
      - name: make studio
        if: (env.CONFIG == 'unlisted' || env.DASH_TESTS == '1') && steps.studio.outputs.cache-hit != 'true'
        run: make studio
      - name: Studio build record
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: studio-build-record-${{ matrix.config }}
          path: ~/.cache/supapace/images/dash/supapace-studio.build-record.json
      - name: make images and browsers
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        run: make images browsers DASH=1
      # The harness's own tests run both configurations themselves: once is enough.
      - name: make browser-test
        if: env.CONFIG == 'unlisted'
        run: |
          set -o pipefail
          trap 'make node-down NODE=sp-browsers SP_OFFSITE=0' EXIT
          make node-bare NODE=sp-browsers SP_OFFSITE=0
          make browser-test NODE=sp-browsers 2>&1 | tee "$RUNNER_TEMP/browser.log"
      - name: make node-up DASH=1
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        run: make node-up DASH=1 STUDIO_DOMAIN=${{ matrix.domain }}
      - name: the suite on the dashboard node
        if: env.CONFIG == 'unlisted' || env.DASH_TESTS == '1'
        run: |
          set -o pipefail
          if [ "${DASH_TESTS:-}" = 1 ] && [ "$CONFIG" = listed ]; then
            CGO_ENABLED=0 go test -c -tags 'reach dash' -o "$RUNNER_TEMP/dash.test" ./test/reach
            "$RUNNER_TEMP/dash.test" -test.list Browser | grep . ||
              { echo "no test of the suite matches Browser: this configuration would run nothing" >&2; exit 1; }
          fi
          if [ "${DASH_TESTS:-}" != 1 ]; then make reach
          elif [ "$CONFIG" = unlisted ]; then make reach-dash
          else make reach-dash REACH_ARGS="-test.run Browser"; fi 2>&1 | tee "$RUNNER_TEMP/reach.log"
      - name: Skipped suite tests
        if: always() && (env.CONFIG == 'unlisted' || env.DASH_TESTS == '1')
        run: echo "::notice title=skipped suite tests (dash ${{ matrix.config }})::$(grep -c -- '--- SKIP' "$RUNNER_TEMP/reach.log" 2>/dev/null) skipped"
      - name: Node logs
        if: failure()
        run: |
          docker logs --tail 50 sp-node || true
          docker exec sp-node tail -n 200 /var/log/supapaced.log || true
      - name: Node down
        if: always()
        run: make node-down
